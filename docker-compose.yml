version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zocial-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - PORT=8000
      - NODE_ENV=production
    networks:
      - zocial-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
        - VITE_SOCKET_URL=http://localhost:8000
    container_name: zocial-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - zocial-network

networks:
  zocial-network:
    driver: bridge
